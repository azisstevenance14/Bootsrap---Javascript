<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Path ke Bootstrap CSS lokal milikmu -->
    <link rel="stylesheet" href="Bootstrap/css/bootstrap.min.css">
    <title>Login System</title>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <!-- Card Form Login -->
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <div class="card-body">
            <!-- Judul -->
            <h3 class="card-title text-center mb-4 fw-bold text-primary">Login App</h3>
            
            <!-- Tempat Pesan Error jika login gagal -->
            <div id="alertMessage" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
                <!-- Input Username -->
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-class form-control" id="username" placeholder="Masukkan username" required>
                </div>

                <!-- Input Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                </div>

                <!-- Tombol Submit Login -->
                <button type="submit" class="btn btn-primary w-100 mt-2">Masuk</button>
            </form>
        </div>
    </div>

    <!-- Script Bootstrap & JS Login -->
    <script src="Bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="Javascript/main.js"></script>
</body>
</html>
